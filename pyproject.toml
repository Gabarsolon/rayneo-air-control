[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rayneo-control"
version = "0.3.1"
description = "Reverse-engineered runtime USB-HID control for RayNeo Air 4 Pro (taurus4p0) AR glasses"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "hidapi>=0.14",
]

[project.optional-dependencies]
gui = [
    "pystray>=0.19",
    "Pillow>=9.0",
]

[project.scripts]
rayneo = "rayneo_control.cli:main"
rayneo-gui = "rayneo_control.gui:main"

[tool.setuptools.packages.find]
include = ["rayneo_control*"]
